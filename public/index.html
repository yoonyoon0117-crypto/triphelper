<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Trip helper✈️</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFFCF4" />
<meta name="description" content="여행 경비 정산과 일정을 가족·친구와 링크 하나로 함께 쓰는 앱" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Trip helper✈️" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="topbar-row">
      <span class="brand">Trip helper✈️</span>
      <div class="topbar-tools">
        <span class="sync" id="syncBadge" title="자동 동기화"><span class="sync-dot"></span><span id="syncText">연결됨</span></span>
        <button class="icon-btn" id="btnSettings" aria-label="여행 설정">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 13.2a7.7 7.7 0 0 0 0-2.4l1.6-1.2-1.7-3-1.9.8a7.6 7.6 0 0 0-2-1.2L15.1 4h-3.4l-.3 2.2c-.7.2-1.4.6-2 1.2l-2-.8-1.6 3 1.6 1.2a7.7 7.7 0 0 0 0 2.4L5.8 14.4l1.6 3 2-.8c.6.5 1.3.9 2 1.2l.3 2.2h3.4l.3-2.2c.7-.3 1.4-.7 2-1.2l2 .8 1.6-3-1.6-1.2Z"/></svg>
        </button>
      </div>
    </div>
    <button class="trip-pill" id="btnTripSwitch">
      <span class="trip-pill-main">
        <span class="trip-name" id="tripName">여행을 불러오는 중…</span>
        <span class="trip-meta" id="tripMeta"></span>
      </span>
      <span class="trip-caret" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
      </span>
    </button>
    <div class="people-strip" id="peopleStrip"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-tab="settle">정산</button>
    <button class="tab" data-tab="plan">일정</button>
    <span class="tab-ink" id="tabInk"></span>
  </nav>

  <main class="view" id="view">
    <div class="loading">불러오는 중…</div>
  </main>

  <div class="addbar" id="addbar">
    <button class="add-btn" id="btnAdd"></button>
  </div>

  <div class="sheet-layer" id="sheetLayer" aria-hidden="true">
    <div class="sheet-backdrop" data-act="close-sheet"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grab"></div>
      <div class="sheet-head">
        <h2 class="sheet-title" id="sheetTitle"></h2>
        <button class="icon-btn sheet-close" data-act="close-sheet" aria-label="닫기">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live=" polite"></div>
</div>
<script src="/app.js" defer></script>
</body>
</html>
